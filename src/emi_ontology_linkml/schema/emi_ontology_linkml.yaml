---
id: https://w3id.org/earth-metabolome-initiative/emi-ontology-linkml
name: emi-ontology-linkml
title: emi-ontology-linkml
description: |-
  Testing LinkML to manage the EMI Ontology
license: https://creativecommons.org/publicdomain/zero/1.0/
see_also:
  - https://earth-metabolome-initiative.github.io/emi-ontology-linkml

prefixes:
  emi_ontology_linkml: https://w3id.org/earth-metabolome-initiative/emi-ontology-linkml/
  linkml: https://w3id.org/linkml/
  biolink: https://w3id.org/biolink/vocab/
  schema: http://schema.org/
  PATO: http://purl.obolibrary.org/obo/PATO_
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_
  example: http://www.example.org/rdf#
  CHEBI: "http://purl.obolibrary.org/obo/CHEBI_"
  ORCID: "https://orcid.org/"
  PUBCHEM.COMPOUND: "https://bioregistry.io/pubchem.compound:"
  wd: "http://www.wikidata.org/entity/"
  skos: "http://www.w3.org/2004/02/skos/core#"
default_prefix: emi
default_range: string

imports:
  - linkml:types
  - annotation # also brings core and portal_*
  - workflow_execution_activity

classes:

  NamedThing:
    description: >-
      A generic grouping for any identifiable entity
    slots:
      - id
      - name
      - description
    class_uri: schema:Thing

  Person:
    is_a: NamedThing
    description: >-
      Represents a Person
    slots:
      - primary_email
      - birth_date
      - age_in_years
      - vital_status
    slot_usage:
      primary_email:
        pattern: "^\\S+@[\\S+\\.]+\\S+"

  PersonCollection:
    tree_root: true
    description: >-
      A holder for Person objects
    attributes:
      entries:
        description: >-
          A collection of Person objects
        range: Person
        multivalued: true
        inlined: true

  MassSpectrometry:
    class_uri: nmdc:MassSpectrometry
    is_a: DataGeneration
    description: Spectrometry where the sample is converted into gaseous ions which are characterised by their mass-to-charge ratio and relative abundance.
    exact_mappings:
      - CHMO:0000470
    slots:
      - eluent_introduction_category
      - generates_calibration
      - has_chromatography_configuration
      - has_mass_spectrometry_configuration
    slot_usage:
      id:
        structured_pattern:
          syntax: "{id_nmdc_prefix}:(dgms|omprc)-{id_shoulder}-{id_blade}$"
          interpolated: true
      has_chromatography_configuration:
        structured_pattern:
          syntax: "{id_nmdc_prefix}:chrcon-{id_shoulder}-{id_blade}$"
          interpolated: true
      has_mass_spectrometry_configuration:
        structured_pattern:
          syntax: "{id_nmdc_prefix}:mscon-{id_shoulder}-{id_blade}$"
          interpolated: true
      analyte_category: 
        range: MassSpectrometryEnum
    rules:
      - title: generates_calibration_required_if_gc
        description: >-
          If eluent_introduction_category is gas_chromatography, then generates_calibration is required.
        preconditions:
          slot_conditions:
            eluent_introduction_category:
              equals_string: gas_chromatography
        postconditions:
          slot_conditions:
            generates_calibration:
              required: true
      - title: has_chromatography_configuration_required_if_lc
        description: >-
          If eluent_introduction_category is liquid_chromatography, then has_chromatography_configuration is required.
        preconditions:
          slot_conditions:
            eluent_introduction_category:
              equals_string: liquid_chromatography
        postconditions:
          slot_conditions:
            has_chromatography_configuration:
              required: true
      - title: has_chromatography_configuration_required_if_gc
        description: >-
          If eluent_introduction_category is gas_chromatography, then has_chromatography_configuration is required.
        preconditions:
          slot_conditions:
            eluent_introduction_category:
              equals_string: gas_chromatography
        postconditions:
          slot_conditions:
            has_chromatography_configuration:
              required: true

  Configuration:
    abstract: true
    is_a: InformationObject
    class_uri: nmdc:Configuration
    description: A set of parameters that define the actions of a process and is shared among multiple instances of the process.
    notes:
      - This class is intended to represent the parameters within a method file (or similar) that control a process.

  MassSpectrometryConfiguration:
    is_a: Configuration
    class_uri: nmdc:MassSpectrometryConfiguration
    description: A set of parameters that define and control the actions of a mass spectrometry process.
    notes:
      - This class is intended to represent a mass spectrometry method file that controls a mass spectrometry process.
    slots:
      - mass_spectrometry_acquisition_strategy
      - resolution_categories
      - mass_analyzers
      - ionization_source
      - mass_spectrum_collection_modes
      - polarity_mode
    slot_usage:
      name:
        required: true
      description:
        required: true
      id:
        structured_pattern:
          syntax: "{id_nmdc_prefix}:mscon-{id_shoulder}-{id_blade}$"
          interpolated: true
  
  ChromatographyConfiguration:
    is_a: Configuration
    class_uri: nmdc:ChromatographyConfiguration
    description: A set of parameters that define and control the actions of a chromatography process.
    notes:
      - This class is intended to represent a chromatography method file associated with a mass spectrometry process.
    slots:
      - chromatographic_category
      - ordered_mobile_phases
      - stationary_phase
      - temperature
    slot_usage:
      name:
        required: true
      description:
        required: true
      id:
        structured_pattern:
          syntax: "{id_nmdc_prefix}:chrcon-{id_shoulder}-{id_blade}$"
          interpolated: true
slots:
  id:
    identifier: true
    slot_uri: schema:identifier
    range: uriorcurie
    description: A unique identifier for a thing
  name:
    slot_uri: schema:name
    description: A human-readable name for a thing
  description:
    slot_uri: schema:description
    description: A human-readable description for a thing
  primary_email:
    slot_uri: schema:email
    description: The main email address of a person
  birth_date:
    slot_uri: schema:birthDate
    range: date
    description: Date on which a person is born
  age_in_years:
    range: integer
    description: Number of years since birth
  vital_status:
    range: PersonStatus
    description: living or dead status

enums:
  PersonStatus:
    description: >-
      The living, dead or unknown status of a person
    permissible_values:
      alive:
        description: the person is living
        meaning: PATO:0001421
      dead:
        description: the person is deceased
        meaning: PATO:0001422
      unknown:
        description: the vital status is not known
        meaning: NCBITaxon:1897498
        todos:
          - map this to an ontology
