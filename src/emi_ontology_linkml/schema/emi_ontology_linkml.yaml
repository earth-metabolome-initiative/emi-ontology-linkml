---
id: https://w3id.org/earth-metabolome-initiative/emi-ontology-linkml
name: emi-ontology-linkml
title: emi-ontology-linkml
description: |-
  Testing LinkML to manage the EMI Ontology
license: MIT
see_also:
  - https://earth-metabolome-initiative.github.io/emi-ontology-linkml

prefixes:
  emi_ontology_linkml: https://w3id.org/earth-metabolome-initiative/emi-ontology-linkml/
  linkml: https://w3id.org/linkml/
  biolink: https://w3id.org/biolink/vocab/
  schema: http://schema.org/
  PATO: http://purl.obolibrary.org/obo/PATO_
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_
  example: http://www.example.org/rdf#
default_prefix: emi_ontology_linkml
default_range: string

imports:
  - linkml:types

classes:

  NamedThing:
    description: >-
      A generic grouping for any identifiable entity
    slots:
      - id
      - name
      - description
    class_uri: schema:Thing

  Person:
    is_a: NamedThing
    description: >-
      Represents a Person
    slots:
      - primary_email
      - birth_date
      - age_in_years
      - vital_status
    slot_usage:
      primary_email:
        pattern: "^\\S+@[\\S+\\.]+\\S+"

  PersonCollection:
    tree_root: true
    description: >-
      A holder for Person objects
    attributes:
      entries:
        description: >-
          A collection of Person objects
        range: Person
        multivalued: true
        inlined: true

slots:
  id:
    identifier: true
    slot_uri: schema:identifier
    range: uriorcurie
    description: A unique identifier for a thing
  name:
    slot_uri: schema:name
    description: A human-readable name for a thing
  description:
    slot_uri: schema:description
    description: A human-readable description for a thing
  primary_email:
    slot_uri: schema:email
    description: The main email address of a person
  birth_date:
    slot_uri: schema:birthDate
    range: date
    description: Date on which a person is born
  age_in_years:
    range: integer
    description: Number of years since birth
  vital_status:
    range: PersonStatus
    description: living or dead status

enums:
  PersonStatus:
    description: >-
      The living, dead or unknown status of a person
    permissible_values:
      alive:
        description: the person is living
        meaning: PATO:0001421
      dead:
        description: the person is deceased
        meaning: PATO:0001422
      unknown:
        description: the vital status is not known
        meaning: NCBITaxon:1897498
        todos:
          - map this to an ontology
